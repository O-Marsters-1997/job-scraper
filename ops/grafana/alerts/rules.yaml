# The datasourceUid placeholders are
# filled in by scripts/grafana-push.sh, which looks up the connected Prometheus and Loki
# datasource UIDs by type — Grafana Cloud assigns these per-stack, so they can't be hardcoded here.
folder:
  uid: pipeline-health
  title: Pipeline health

ruleGroup: pipeline-health

rules:
  - uid: target-down
    title: Target down
    condition: C
    for: 5m
    noDataState: NoData
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: "{{ $labels.job }} target is down"
    data:
      - refId: A
        queryType: ""
        relativeTimeRange:
          from: 300
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: A
          expr: up{env="prod", job=~"api|worker"} == 0
          instant: true
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [0]

  - uid: error-burst
    title: Error burst
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.service }} logged {{ $values.A }} ERROR lines in the last 10m"
    data:
      - refId: A
        queryType: range
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __LOKI_DATASOURCE_UID__
        model:
          refId: A
          queryType: range
          expr: sum by (service) (count_over_time({env="prod"} |= "ERROR" [10m]))
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [20]

  - uid: state-scrape-failing
    title: State scrape failing
    condition: C
    for: 10m
    noDataState: NoData
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: "the last OpsState read failed"
    data:
      - refId: A
        queryType: ""
        relativeTimeRange:
          from: 300
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: A
          expr: jobscraper_state_up{env="prod"} == 0
          instant: true
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [0]

  - uid: scoring-stalled
    title: Scoring stalled
    condition: C
    for: 5m
    noDataState: NoData
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: "the oldest pending scoring effect is {{ $values.A }}s old"
    data:
      - refId: A
        queryType: ""
        relativeTimeRange:
          from: 300
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: A
          expr: jobscraper_outbox_oldest_pending_seconds{env="prod"}
          instant: true
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [1800]

  - uid: scoring-failed
    title: Scoring failed
    condition: C
    for: 5m
    noDataState: NoData
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: "{{ $values.A }} scoring effects have failed"
    data:
      - refId: A
        queryType: ""
        relativeTimeRange:
          from: 300
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: A
          expr: jobscraper_outbox_failed{env="prod"}
          instant: true
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [0]

  - uid: dead-letters
    title: Dead letters
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: "{{ $values.A }} messages ready in source.dead"
    data:
      - refId: A
        queryType: ""
        relativeTimeRange:
          from: 300
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: A
          expr: rabbitmq_detailed_queue_messages_ready{env="prod", queue="source.dead"}
          instant: true
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [0]

  - uid: queue-not-draining
    title: Queue not draining
    condition: C
    for: 30m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.queue }} has {{ $values.A }} ready messages and isn't draining"
    data:
      - refId: A
        queryType: ""
        relativeTimeRange:
          from: 300
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: A
          expr: rabbitmq_detailed_queue_messages_ready{env="prod", queue=~"source\\..*", queue!="source.dead"}
          instant: true
      - refId: B
        queryType: ""
        relativeTimeRange:
          from: 1800
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: B
          expr: deriv(rabbitmq_detailed_queue_messages_ready{env="prod", queue=~"source\\..*", queue!="source.dead"}[30m])
          instant: true
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: math
          expression: "$A > 0 && $B >= 0"

  - uid: queue-wait-high
    title: Queue wait high
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: "queue wait p95 is {{ $values.A }}ms over the last 30m"
    data:
      - refId: A
        queryType: range
        relativeTimeRange:
          from: 1800
          to: 0
        datasourceUid: __LOKI_DATASOURCE_UID__
        model:
          refId: A
          queryType: range
          expr: quantile_over_time(0.95, {env="prod"} | json event="event" | event="task.done" | unwrap wait_ms [30m])
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [900000]

  - uid: api-5xx
    title: API 5xx
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.service }} 5xx ratio is above 5% over the last 10m"
    data:
      - refId: A
        queryType: range
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __LOKI_DATASOURCE_UID__
        model:
          refId: A
          queryType: range
          expr: sum by (service) (count_over_time({env="prod"} | json | event="http.request" [10m]))
      - refId: B
        queryType: range
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __LOKI_DATASOURCE_UID__
        model:
          refId: B
          queryType: range
          expr: sum by (service) (count_over_time({env="prod"} | json | event="http.request" | status >= 500 [10m]))
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: math
          expression: "$A > 20 && ($B / $A) > 0.05"

  - uid: user-spend-high
    title: User spend
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.user_id }} spent ${{ $values.A }} on scoring in the last 24h"
    data:
      - refId: A
        queryType: range
        relativeTimeRange:
          from: 86400
          to: 0
        datasourceUid: __LOKI_DATASOURCE_UID__
        model:
          refId: A
          queryType: range
          expr: sum by (user_id) (sum_over_time({env="prod"} | json | event="score.call" | unwrap cost_usd [24h]))
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [5]

  - uid: api-slow
    title: API slow
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.service }} p95 request latency is {{ $values.A }}ms over the last 15m"
    data:
      - refId: A
        queryType: range
        relativeTimeRange:
          from: 900
          to: 0
        datasourceUid: __LOKI_DATASOURCE_UID__
        model:
          refId: A
          queryType: range
          expr: quantile_over_time(0.95, {env="prod"} | json | event="http.request" | unwrap duration_ms [15m]) by (service)
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [2000]

  - uid: boards-overdue
    title: Boards overdue
    condition: C
    for: 30m
    noDataState: NoData
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: "{{ $values.A }} verified Boards are past next_due_at and not being checked"
    data:
      - refId: A
        queryType: ""
        relativeTimeRange:
          from: 300
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: A
          expr: jobscraper_boards_overdue{env="prod"}
          instant: true
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [0]

  - uid: board-failing
    title: Board failing
    condition: C
    for: 10m
    noDataState: NoData
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: "{{ $values.A }} Boards have failed 3 or more consecutive checks"
    data:
      - refId: A
        queryType: ""
        relativeTimeRange:
          from: 300
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: A
          expr: jobscraper_boards_failing{env="prod"}
          instant: true
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [0]

  - uid: harvest-stale
    title: Harvest stale
    condition: C
    for: 0m
    noDataState: NoData
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.harvester }} last succeeded {{ $values.A }}s ago"
    data:
      - refId: A
        queryType: ""
        relativeTimeRange:
          from: 300
          to: 0
        datasourceUid: __PROM_DATASOURCE_UID__
        model:
          refId: A
          expr: jobscraper_harvest_age_seconds{env="prod"}
          instant: true
      - refId: C
        queryType: ""
        relativeTimeRange:
          from: 0
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: A
          conditions:
            - evaluator:
                type: gt
                params: [129600]
