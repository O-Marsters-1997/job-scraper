version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/data/sqlc/queries"
    schema: "internal/data/sqlc/schema.sql"
    gen:
      go:
        package: "pgsqlc"
        out: "internal/data/db/pgsqlc"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    queries: "internal/applications/internal/store/queries"
    schema: "internal/data/sqlc/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/applications/internal/store/sqlc"
        sql_package: "pgx/v5"
