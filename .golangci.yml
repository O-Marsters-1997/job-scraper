version: "2"

linters:
  default: none
  enable:
    - errcheck # unchecked errors
    - govet # vet checks
    - ineffassign # unused assignments
    - staticcheck # static analysis
    - unused # unused code
    - misspell # spelling
    - exhaustive # exhaustive enum switches
    - depguard # internal/api, internal/worker and shared package boundaries; test-double leakage
    - forbidigo # bans reflect.DeepEqual and time.Sleep in tests (ADR 0012)
    - thelper # test helpers call t.Helper()
    - tparallel # correct t.Parallel() usage
    - errorlint # error wrapping correctness
    - usetesting # prefer testing package helpers over manual equivalents
    - sloglint # consistent slog usage: *Context calls, attrs, snake_case keys (ADR 0013)
  settings:
    usetesting:
      context-background: true
      context-todo: true
    forbidigo:
      forbid:
        - pattern: '^reflect\.DeepEqual$'
          msg: use cmp.Diff(want, got) instead (ADR 0012)
        - pattern: '^time\.Sleep$'
          msg: poll with a ticker and a deadline instead (ADR 0012)
    sloglint:
      attr-only: true
      context: scope
      static-msg: true
      key-naming-case: snake
      forbidden-keys: ["time", "level", "msg"]
    depguard:
      rules:
        test-doubles:
          # depguard matches exact import paths, not globs; list each *test double
          # package here as it's added (ADR 0012).
          files: ["$all", "!**/*_test.go"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/queue/queuetest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/handlers/handlerstest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/applications/applicationstest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/events/eventstest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/cvtemplates/cvtemplatestest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/identity/identitytest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/jobsearch/jobsearchtest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/scoring/scoringtest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/cvtailor/cvtailortest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
        no-testify:
          files: ["**/*_test.go"]
          deny:
            - pkg: github.com/stretchr/testify
              desc: no testify in this repo; use cmp.Diff and errors.Is/As (ADR 0012)
        api:
          files: ["**/internal/api/**", "**/cmd/api/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/worker
              desc: the API never fetches from sources; publish a queue task for the worker (ADR 0009)
        worker:
          files: ["**/internal/worker/**", "**/cmd/worker/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/api
              desc: the worker reaches the API over POST /ingest, not by import (ADR 0009)
        shared:
          files: ["**/internal/**", "!**/internal/api/**", "!**/internal/worker/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/api
              desc: packages at the internal/ root are shared; move this code under internal/api
            - pkg: github.com/ollymarsters/job-scraper/internal/worker
              desc: packages at the internal/ root are shared; move this code under internal/worker
        kernel:
          files: ["**/internal/**", "!**/internal/services/**", "!**/internal/api/**", "!**/internal/worker/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services
              desc: the shared kernel never imports a context; move this code into the context that owns it (ADR 0011)
        applications-store:
          files: ["$all", "!**/internal/services/applications/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/applications/store
              desc: only the applications context uses its store; call the applications Module facade (ADR 0011)
        events-store:
          files: ["$all", "!**/internal/services/events/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/events/store
              desc: only the events context uses its store; call the events Module facade (ADR 0011)
        cvtemplates-store:
          files: ["$all", "!**/internal/services/cvtemplates/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/cvtemplates/store
              desc: only the cvtemplates context uses its store; call the cvtemplates Module facade (ADR 0011)
        identity-store:
          files: ["$all", "!**/internal/services/identity/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/identity/store
              desc: only the identity context uses its store; call the identity Module facade (ADR 0011)
        jobsearch-store:
          files: ["$all", "!**/internal/services/jobsearch/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/jobsearch/store
              desc: only the jobsearch context uses its store; call the jobsearch Module facade (ADR 0011)
        scoring-store:
          files: ["$all", "!**/internal/services/scoring/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/scoring/store
              desc: only the scoring context uses its store; call the scoring Module facade (ADR 0011)
        cvtailor-store:
          files: ["$all", "!**/internal/services/cvtailor/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/cvtailor/store
              desc: only the cvtailor context uses its store; call the cvtailor Module facade (ADR 0011)
  exclusions:
    rules:
      # forbidigo's reflect.DeepEqual/time.Sleep bans are a test-only policy (ADR 0012);
      # production code may legitimately use either.
      - path-except: _test\.go
        linters:
          - forbidigo

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ollymarsters/job-scraper

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
