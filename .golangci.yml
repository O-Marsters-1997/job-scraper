version: "2"

linters:
  default: none
  enable:
    - errcheck # unchecked errors
    - govet # vet checks
    - ineffassign # unused assignments
    - staticcheck # static analysis
    - unused # unused code
    - misspell # spelling
    - exhaustive # exhaustive enum switches
    - depguard # internal/api, internal/worker and shared package boundaries; test-double leakage
    - forbidigo # bans reflect.DeepEqual and time.Sleep in tests (ADR 0012)
    - thelper # test helpers call t.Helper()
    - tparallel # correct t.Parallel() usage
    - errorlint # error wrapping correctness
    - usetesting # prefer testing package helpers over manual equivalents
    - sloglint # consistent slog usage: *Context calls, attrs, snake_case keys (ADR 0013)
    - gosec # security checks; G112 kept, G115/G304 excluded by path below
    - noctx # HTTP requests and exec without a context
    - contextcheck # ctx passed down instead of context.Background
    - errchkjson # unchecked or impossible json marshal errors
    - nilerr # returning nil when err is non-nil
    - bodyclose # unclosed HTTP response bodies
    - sqlclosecheck # unclosed sql rows and statements
    - rowserrcheck # unchecked rows.Err
    - forcetypeassert # unchecked type assertions
    - recvcheck # mixed value and pointer receivers
    - canonicalheader # non-canonical HTTP header keys
    - modernize # stdlib modernisations
    - paralleltest # missing t.Parallel (ADR 0012)
    - gochecknoglobals # package-level state; inject dependencies instead
  settings:
    usetesting:
      context-background: true
      context-todo: true
    forbidigo:
      forbid:
        - pattern: '^reflect\.DeepEqual$'
          msg: use cmp.Diff(want, got) instead (ADR 0012)
        - pattern: '^time\.Sleep$'
          msg: poll with a ticker and a deadline instead (ADR 0012)
        - pattern: '^slog\.(Default|SetDefault)$'
          msg: inject the *slog.Logger built in main; no global logger (ADR 0013)
        - pattern: '^slog\.(Debug|Info|Warn|Error|Log|LogAttrs)(Context)?$'
          msg: log through an injected *slog.Logger at the top of the chain (ADR 0013)
        - pattern: '^os\.(Getenv|LookupEnv)$'
          msg: read the environment once into a typed Config in cmd/ (ADR 0011)
    sloglint:
      attr-only: true
      context: scope
      static-msg: true
      key-naming-case: snake
      forbidden-keys: ["time", "level", "msg"]
    depguard:
      rules:
        test-doubles:
          # depguard matches exact import paths, not globs; list each *test double
          # package here as it's added (ADR 0012).
          files: ["$all", "!**/*_test.go"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/queue/queuetest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/handlers/handlerstest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/applications/applicationstest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/events/eventstest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/cvtemplates/cvtemplatestest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/identity/identitytest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/jobsearch/jobsearchtest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/scoring/scoringtest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/cvtailor/cvtailortest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/services/tasks/taskstest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
            - pkg: github.com/ollymarsters/job-scraper/internal/worker/sources/sourcetest
              desc: test-double packages (*test) are only imported from _test.go files (ADR 0012)
        no-testify:
          files: ["**/*_test.go"]
          deny:
            - pkg: github.com/stretchr/testify
              desc: no testify in this repo; use cmp.Diff and errors.Is/As (ADR 0012)
        api:
          files: ["**/internal/api/**", "**/cmd/api/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/worker
              desc: the API never fetches from sources; publish a queue task for the worker (ADR 0009)
        worker:
          files: ["**/internal/worker/**", "**/cmd/worker/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/api
              desc: the worker reaches the API over POST /ingest, not by import (ADR 0009)
        shared:
          files: ["**/internal/**", "!**/internal/api/**", "!**/internal/worker/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/api
              desc: packages at the internal/ root are shared; move this code under internal/api
            - pkg: github.com/ollymarsters/job-scraper/internal/worker
              desc: packages at the internal/ root are shared; move this code under internal/worker
        kernel:
          files: ["**/internal/**", "!**/internal/services/**", "!**/internal/api/**", "!**/internal/worker/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services
              desc: the shared kernel never imports a context; move this code into the context that owns it (ADR 0011)
        no-apperr-in-store:
          files: ["**/internal/services/*/store/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/apperr
              desc: stores return their own sentinels; the service maps them to apperr kinds (ADR 0011)
        pgxpool-in-store-only:
          files: ["$all", "!**/internal/services/*/store/**", "!**/internal/data/db/**", "!**/internal/pgtest/**", "!**/cmd/**", "!**/*_test.go"]
          deny:
            - pkg: github.com/jackc/pgx/v5/pgxpool
              desc: only stores and internal/data/db hold the pool; pgx.Tx stays legal in tx-scoped ports (ADR 0011)
        sourcetargets:
          files: ["$all", "!**/internal/services/jobsearch/**", "!**/internal/services/sourcetargets/**", "!**/cmd/api/**", "!**/*_test.go"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/sourcetargets
              desc: sourcetargets is a split-out feature of jobsearch; reach it through the jobsearch Module (ADR 0011)
        applications-store:
          files: ["$all", "!**/internal/services/applications/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/applications/store
              desc: only the applications context uses its store; call the applications Module facade (ADR 0011)
        tasks-store:
          files: ["$all", "!**/internal/services/tasks/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/tasks/store
              desc: only the tasks context uses its store; call the tasks Module facade (ADR 0011)
        events-store:
          files: ["$all", "!**/internal/services/events/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/events/store
              desc: only the events context uses its store; call the events Module facade (ADR 0011)
        cvtemplates-store:
          files: ["$all", "!**/internal/services/cvtemplates/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/cvtemplates/store
              desc: only the cvtemplates context uses its store; call the cvtemplates Module facade (ADR 0011)
        identity-store:
          files: ["$all", "!**/internal/services/identity/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/identity/store
              desc: only the identity context uses its store; call the identity Module facade (ADR 0011)
        jobsearch-store:
          files: ["$all", "!**/internal/services/jobsearch/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/jobsearch/store
              desc: only the jobsearch context uses its store; call the jobsearch Module facade (ADR 0011)
        scoring-store:
          files: ["$all", "!**/internal/services/scoring/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/scoring/store
              desc: only the scoring context uses its store; call the scoring Module facade (ADR 0011)
        cvtailor-store:
          files: ["$all", "!**/internal/services/cvtailor/**"]
          deny:
            - pkg: github.com/ollymarsters/job-scraper/internal/services/cvtailor/store
              desc: only the cvtailor context uses its store; call the cvtailor Module facade (ADR 0011)
  exclusions:
    paths:
      - frontend
    rules:
      # reflect.DeepEqual and time.Sleep are banned in tests only (ADR 0012); production code may use either.
      - path-except: _test\.go
        linters:
          - forbidigo
        text: 'reflect\.DeepEqual|time\.Sleep'
      # main owns the environment and builds the logger (ADR 0011 and ADR 0013).
      - path: ^cmd/|^internal/pgtest/|_test\.go
        linters:
          - forbidigo
        text: 'os\.(Getenv|LookupEnv)|slog\.'
      - path: ^internal/worker/discover/sluglist/
        linters:
          - forbidigo
        text: 'slog\.'
      - path: _test\.go
        linters:
          - gosec
        text: G115|G304
      - path: _test\.go|^internal/pgtest/|^internal/worker/sources/sourcetest/|test/[a-z]+\.go$
        linters:
          - gochecknoglobals
      - path: ^cmd/
        linters:
          - gochecknoglobals
      - path: ^internal/worker/proxy/fetch\.go$
        linters:
          - gochecknoglobals
        text: '\b(allSlots|hostSlots|sharedCache)\b'
      - path: ^internal/(telemetry/state|worker/proxy/metrics|services/sourcetargets/metrics)\.go$
        linters:
          - gochecknoglobals
        text: '\b(FetchRequests|FetchBytes|FetchWireBytes|TargetsDisabled|\w+Desc)\b'
      - path: ^internal/worker/discover/resolve\.go$
        linters:
          - gochecknoglobals
        text: '\bseedPaths\b'
      - path: ^internal/detect/
        linters:
          - gochecknoglobals
        text: '\b(atsSourceName|teamtailorReserved|hibobReserved|searchBoards|unsupportedBoards|sniffPatterns)\b'
      - path: ^internal/(docparse|handlers|jobmatch|salary|slug|sourcespec)/
        linters:
          - gochecknoglobals
        text: '\b(separators|sessionKey|placeWords|remoteWords|symbols|legalSuffixes|entries)\b'
      - path: ^internal/services/
        linters:
          - gochecknoglobals
        text: '\b(foldText|PromptVersion|SuggestPromptVersion|checkNames|titleSeps|dateForms|suggestActions|promptTemplate|picksSchema|dummyHash|choiceCriteria|likeEscaper|individualTemplate|sizeOptionIDs|stageOptionIDs|pickStrength|defaultBands|cellEscaper|gradeValues|gradeReasons|Dimensions|dimensionSpecs|ladderLevels|currencySymbols)\b'
      - path: ^internal/worker/(discover|sources)/
        linters:
          - gochecknoglobals
        text: '\b(patterns|notBoards|workArrangements|salaryPeriods|Lists|apiHeaders|relativeUnit|browserHeader|ukLocations)\b'

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ollymarsters/job-scraper

issues:
  new-from-merge-base: origin/main
  max-issues-per-linter: 0
  max-same-issues: 0
