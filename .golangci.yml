version: "2"

linters:
  default: none
  enable:
    - errcheck      # unchecked errors
    - gosimple      # simplify code
    - govet         # vet checks
    - ineffassign   # unused assignments
    - staticcheck   # static analysis
    - unused        # unused code
    - gofmt         # formatting
    - goimports     # import grouping/ordering
    - misspell      # spelling
    - exhaustive    # exhaustive enum switches

linters-settings:
  goimports:
    local-prefixes: github.com/ollymarsters/job-scraper

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
