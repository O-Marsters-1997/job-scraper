version: "2"

linters:
  default: none
  enable:
    - errcheck # unchecked errors
    - govet # vet checks
    - ineffassign # unused assignments
    - staticcheck # static analysis
    - unused # unused code
    - misspell # spelling
    - exhaustive # exhaustive enum switches

linters-settings:
  goimports:
    local-prefixes: github.com/ollymarsters/job-scraper

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
