services:
  worker:
    build: .
    command: ./worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env.docker-compose
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672

  api:
    build: .
    command: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env.docker-compose
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit heartbeat ${RABBITMQ_SERVER_HEARTBEAT:-60}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    profiles: [observability]
    env_file: .env.docker-compose
    environment:
      ENV: ${ALLOY_ENV:-dev}
      API_METRICS_TARGET: ${API_METRICS_TARGET:-api:9091}
      WORKER_METRICS_TARGET: ${WORKER_METRICS_TARGET:-worker:9091}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]

volumes:
  db_data:
  rabbitmq_data:
  alloy_data:
